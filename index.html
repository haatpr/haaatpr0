// plugin.yml gerekiyor, aşağıya bak
public class HaatLive extends JavaPlugin {
    private String SITE_URL = "https://SENIN-SITEN.com"; // <-- BURAYI DEĞİŞTİR
    private HttpClient client;
    @Override
    public void onEnable() {
        saveDefaultConfig();
        SITE_URL = getConfig().getString("site-url", SITE_URL);
        client = HttpClient.newHttpClient();
        getLogger().info("HAATPRSMP Canlı Okuyucu aktif! Site: " + SITE_URL);

        Bukkit.getScheduler().runTaskTimerAsynchronously(this, this::push, 20L, 600L);

    }
    private void push() {
        try {
            int online = Bukkit.getOnlinePlayers().size();
            int max = Bukkit.getMaxPlayers();
            String idem = "live-" + System.currentTimeMillis() + "-" + online;
            String body = "{"
              + "\\"action\\":\\"records.create\\","
              + "\\"args\\":{"
              + "\\"collection\\":\\"live_status\\","
              + "\\"idempotency_key\\":\\"" + idem + "\\","
              + "\\"value\\":{"
              + "\\"online\\":" + online + ","
              + "\\"max\\":" + max + ","
              + "\\"kaynak\\":\\"aternos-plugin\\","
              + "\\"not\\":\\"\\","
              + "\\"tarih\\":\\"" + Instant.now().toString() + "\\""
              + "}"
              + "}"
              + "}";
            HttpRequest req = HttpRequest.newBuilder()
                .uri(URI.create(SITE_URL + "/actions"))
                .header("content-type", "application/json")
                .POST(HttpRequest.BodyPublishers.ofString(body))
                .timeout(java.time.Duration.ofSeconds(8))
                .build();
            client.sendAsync(req, HttpResponse.BodyHandlers.ofString())
                  .thenAccept(r -> getLogger().info("Canlı durum: " + online + "/" + max));
        } catch (Exception e) {
            getLogger().warning("Hata: " + e.getMessage());
        }
    }
}
